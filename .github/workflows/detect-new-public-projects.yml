name: Detect new public projects

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find public repositories missing from the portfolio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const owner = "Schrotty74";
          const portfolioRepository = `${owner}/Portfolio`;
          const ignoredRepositories = new Set([
            "Portfolio",
            "Schrotty74"
          ]);

          const trackedRepositories = new Set(
            Object.keys(JSON.parse(fs.readFileSync("release-status.json", "utf8")))
          );

          async function githubJson(path, options = {}) {
            const response = await fetch(`https://api.github.com${path}`, {
              ...options,
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28",
                ...(options.headers || {})
              }
            });

            if (!response.ok) {
              const body = await response.text();
              throw new Error(`GitHub API ${response.status} for ${path}: ${body}`);
            }

            return response.json();
          }

          async function readPublicRepositories() {
            const repositories = [];

            for (let page = 1; ; page += 1) {
              const batch = await githubJson(
                `/users/${owner}/repos?type=owner&sort=created&direction=desc&per_page=100&page=${page}`
              );
              repositories.push(...batch);
              if (batch.length < 100) break;
            }

            return repositories;
          }

          async function issueAlreadyExists(repositoryName) {
            const marker = `portfolio-new-project:${repositoryName}`;
            const query = encodeURIComponent(
              `repo:${portfolioRepository} is:issue in:body "${marker}"`
            );
            const result = await githubJson(`/search/issues?q=${query}&per_page=1`);
            return result.total_count > 0;
          }

          async function createPortfolioIssue(repository) {
            const marker = `portfolio-new-project:${repository.name}`;
            const description = repository.description || "No public repository description is set.";
            const body = [
              `<!-- ${marker} -->`,
              "A new public Schrotty74 repository was detected that is not yet tracked by the portfolio release-status data.",
              "",
              `Repository: ${repository.html_url}`,
              `Description: ${description}`,
              `Created: ${repository.created_at}`,
              "",
              "Before adding it to the public portfolio, verify that it is actually an app or collection that should be presented.",
              "",
              "Portfolio checklist:",
              "- [ ] Review public repository content and privacy",
              "- [ ] Add English and German project cards",
              "- [ ] Add English and German detail pages",
              "- [ ] Add the repository to the release-status workflow",
              "- [ ] Add the project to the GitHub profile README",
              "- [ ] Use only public assets and synthetic demo data",
              "- [ ] Add PORTFOLIO_UPDATE.md to the project repository when appropriate",
              "",
              "This issue was created automatically. The project itself was not added automatically."
            ].join("\n");

            await githubJson(`/repos/${portfolioRepository}/issues`, {
              method: "POST",
              body: JSON.stringify({
                title: `Portfolio prüfen: ${repository.name}`,
                body
              })
            });
          }

          (async () => {
            const repositories = await readPublicRepositories();
            const candidates = repositories.filter(repository =>
              !repository.fork &&
              !repository.archived &&
              !repository.disabled &&
              !ignoredRepositories.has(repository.name) &&
              !trackedRepositories.has(repository.name)
            );

            for (const repository of candidates) {
              if (await issueAlreadyExists(repository.name)) {
                console.log(`Already reported: ${repository.name}`);
                continue;
              }

              await createPortfolioIssue(repository);
              console.log(`Reported new public repository: ${repository.name}`);
            }

            if (candidates.length === 0) {
              console.log("No new public repositories found.");
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
