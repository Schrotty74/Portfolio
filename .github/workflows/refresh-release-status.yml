name: Refresh portfolio release statuses

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-release-status.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read latest public releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const repositories = [
            "AppAtlas", "FileAtlas", "CodexVault", "BudgetAtlas", "CalcBoy",
            "Skybreak-Protocol", "UroBilanz", "HealthAtlas", "ThermalAtlas",
            "chatgpt-pets", "Shortcuts"
          ];

          async function githubJson(path) {
            const response = await fetch(`https://api.github.com${path}`, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28"
              }
            });
            if (!response.ok) throw new Error(`Could not read ${path}: ${response.status}`);
            return response.json();
          }

          async function latestStatus(repository) {
            const releases = await githubJson(`/repos/Schrotty74/${repository}/releases?per_page=100`);
            const published = releases.filter(candidate => !candidate.draft);
            const releaseInfo = release => release ? {
              release: release.tag_name,
              updatedAt: release.published_at || release.created_at,
              assets: {
                dmg: release.assets.find(asset => asset.name.toLowerCase().endsWith(".dmg"))?.browser_download_url || null,
                zip: release.assets.find(asset => asset.name.toLowerCase().endsWith(".zip"))?.browser_download_url || null
              }
            } : null;
            const final = published.find(candidate => !candidate.prerelease);
            const beta = published.find(candidate => candidate.prerelease);
            const preferred = [final, beta].filter(Boolean).reduce((newest, candidate) => {
              if (!newest) return candidate;
              const newestTime = Date.parse(newest.published_at || newest.created_at || 0);
              const candidateTime = Date.parse(candidate.published_at || candidate.created_at || 0);
              return candidateTime > newestTime ? candidate : newest;
            }, null);
            if (preferred) return {
              stage: preferred.prerelease ? "Beta" : "Final",
              release: preferred.tag_name,
              updatedAt: preferred.published_at || preferred.created_at,
              assets: releaseInfo(preferred).assets,
              final: releaseInfo(final),
              beta: releaseInfo(beta)
            };
            const repositoryData = await githubJson(`/repos/Schrotty74/${repository}`);
            return {
              stage: "Development",
              release: null,
              updatedAt: repositoryData.pushed_at || repositoryData.updated_at || null,
              assets: { dmg: null, zip: null },
              final: null,
              beta: null
            };
          }

          (async () => {
            const entries = await Promise.all(repositories.map(async repository => [repository, await latestStatus(repository)]));
            fs.writeFileSync("release-status.json", JSON.stringify(Object.fromEntries(entries), null, 2) + "\n");
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Commit changed status data
        run: |
          if git diff --quiet -- release-status.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-status.json
          git commit -m "Refresh portfolio release statuses"
          git push
