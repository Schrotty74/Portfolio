name: Refresh portfolio release statuses

on:
  schedule:
    - cron: "23 4,16 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-release-status.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read latest public releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const repositories = [
            "AppAtlas", "FileAtlas", "CodexVault", "BudgetAtlas", "CalcBoy",
            "Skybreak-Protocol", "UroBilanz", "HealthAtlas", "ThermalAtlas",
            "chatgpt-pets", "Shortcuts"
          ];

          async function githubJson(path) {
            const response = await fetch(`https://api.github.com${path}`, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28"
              }
            });
            if (!response.ok) throw new Error(`Could not read ${path}: ${response.status}`);
            return response.json();
          }

          async function latestStatus(repository) {
            const releases = await githubJson(`/repos/Schrotty74/${repository}/releases?per_page=100`);
            const published = releases.filter(candidate => !candidate.draft);
            const releaseInfo = release => release ? {
              release: release.tag_name,
              updatedAt: release.published_at || release.created_at,
              assets: {
                dmg: release.assets.find(asset => asset.name.toLowerCase().endsWith(".dmg"))?.browser_download_url || null,
                zip: release.assets.find(asset => asset.name.toLowerCase().endsWith(".zip"))?.browser_download_url || null
              }
            } : null;
            const final = published.find(candidate => !candidate.prerelease);
            const beta = published.find(candidate => candidate.prerelease);
            const preferred = [final, beta].filter(Boolean).reduce((newest, candidate) => {
              if (!newest) return candidate;
              const newestTime = Date.parse(newest.published_at || newest.created_at || 0);
              const candidateTime = Date.parse(candidate.published_at || candidate.created_at || 0);
              return candidateTime > newestTime ? candidate : newest;
            }, null);
            if (preferred) return {
              stage: preferred.prerelease ? "Beta" : "Final",
              release: preferred.tag_name,
              updatedAt: preferred.published_at || preferred.created_at,
              assets: releaseInfo(preferred).assets,
              final: releaseInfo(final),
              beta: releaseInfo(beta)
            };
            const repositoryData = await githubJson(`/repos/Schrotty74/${repository}`);
            return {
              stage: "Development",
              release: null,
              updatedAt: repositoryData.pushed_at || repositoryData.updated_at || null,
              assets: { dmg: null, zip: null },
              final: null,
              beta: null
            };
          }

          (async () => {
            const entries = await Promise.all(repositories.map(async repository => [repository, await latestStatus(repository)]));
            const status = Object.fromEntries(entries);
            fs.writeFileSync("release-status.json", JSON.stringify(status, null, 2) + "\n");

            const bundlePath = "assets/app-detail.js";
            const bundle = fs.readFileSync(bundlePath, "utf8");
            const embeddedStatusPattern = /,p=\{.*?\},m=n\(\),h=/s;
            const replacement = `,p=${JSON.stringify(status)},m=n(),h=`;
            if (!embeddedStatusPattern.test(bundle)) {
              throw new Error("Could not locate embedded release status data in assets/app-detail.js");
            }
            const updatedBundle = bundle.replace(embeddedStatusPattern, replacement);
            fs.writeFileSync(bundlePath, updatedBundle);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Sync GitHub profile release statuses
        env:
          PROFILE_SYNC_TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN }}
        run: |
          if [ -z "$PROFILE_SYNC_TOKEN" ]; then
            echo "PROFILE_SYNC_TOKEN is not configured; skipping profile sync."
            exit 0
          fi
          node <<'NODE'
          const fs = require("fs");
          const status = JSON.parse(fs.readFileSync("release-status.json", "utf8"));
          const owner = "Schrotty74";
          const profileRepo = "Schrotty74";

          function releaseUrl(repository, tag) {
            return `https://github.com/${owner}/${repository}/releases/tag/${tag}`;
          }

          function statusLine(repository, data, language) {
            if (!data.final && !data.beta) {
              return language === "de" ? "**Status:** Entwicklung" : "**Status:** Development";
            }
            const parts = [];
            if (data.beta) parts.push(`Beta [${data.beta.release}](${releaseUrl(repository, data.beta.release)})`);
            if (data.final) parts.push(`Final [${data.final.release}](${releaseUrl(repository, data.final.release)})`);
            return `**Status:** ${parts.join(" · ")}`;
          }

          function applyStatusBlocks(content, language) {
            content = content
              .replace("Privacy-first local Apple Health export analysis for macOS. Final 1.0.0.", "Privacy-first local Apple Health export analysis for macOS.")
              .replace("Datenschutzorientierte lokale Auswertung von Apple-Health-Exporten unter macOS. Final 1.0.0.", "Datenschutzorientierte lokale Auswertung von Apple-Health-Exporten unter macOS.")
              .replace(" · [Release 1.0.0](https://github.com/Schrotty74/HealthAtlas/releases/tag/v1.0.0)", "");

            const featuredHeading = language === "de" ? "## Ausgewählte Projekte" : "## Featured projects";
            const featuredStart = content.indexOf(featuredHeading);
            if (featuredStart < 0) throw new Error(`Could not find ${featuredHeading}`);

            for (const [repository, data] of Object.entries(status)) {
              const repositoryUrl = `https://github.com/${owner}/${repository}`;
              const position = content.indexOf(repositoryUrl, featuredStart);
              if (position < 0) continue;

              const sectionStart = content.lastIndexOf("\n### ", position);
              const nextSection = content.indexOf("\n### ", position);
              const repoActivity = content.indexOf("\n## Repo activity", position);
              const sectionEnd = nextSection >= 0 ? nextSection : (repoActivity >= 0 ? repoActivity : content.length);
              let section = content.slice(sectionStart, sectionEnd);

              const startMarker = `<!-- release-status:${repository}:start -->`;
              const endMarker = `<!-- release-status:${repository}:end -->`;
              const block = `${startMarker}\n${statusLine(repository, data, language)}\n${endMarker}`;
              const markerPattern = new RegExp(
                `<!-- release-status:${repository}:start -->[\\s\\S]*?<!-- release-status:${repository}:end -->`
              );

              if (markerPattern.test(section)) {
                section = section.replace(markerPattern, block);
              } else {
                const lines = section.split("\n");
                const linkIndex = lines.findIndex(line => line.includes(repositoryUrl));
                if (linkIndex >= 0) lines.splice(linkIndex, 0, block);
                section = lines.join("\n");
              }

              content = content.slice(0, sectionStart) + section + content.slice(sectionEnd);
            }
            return content;
          }

          async function api(path, options = {}) {
            const response = await fetch(`https://api.github.com${path}`, {
              ...options,
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.PROFILE_SYNC_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28",
                ...(options.headers || {})
              }
            });
            if (!response.ok) {
              throw new Error(`${options.method || "GET"} ${path} failed: ${response.status}`);
            }
            return response.json();
          }

          async function updateReadme(path, language) {
            const current = await api(`/repos/${owner}/${profileRepo}/contents/${path}`);
            const decoded = Buffer.from(current.content, "base64").toString("utf8");
            const updated = applyStatusBlocks(decoded, language);
            if (updated === decoded) return;

            await api(`/repos/${owner}/${profileRepo}/contents/${path}`, {
              method: "PUT",
              body: JSON.stringify({
                message: "Sync profile release statuses",
                content: Buffer.from(updated, "utf8").toString("base64"),
                sha: current.sha
              })
            });
          }

          (async () => {
            await updateReadme("README.md", "en");
            await updateReadme("README.de.md", "de");
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Commit changed status data
        run: |
          if git diff --quiet -- release-status.json assets/app-detail.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-status.json assets/app-detail.js
          git commit -m "Refresh portfolio release statuses"
          git pull --rebase origin main
          git push

# profile-sync-ready
