name: Apply global cache version

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "assets/**"
      - ".github/workflows/global-cache-bust.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: portfolio-global-cache-bust
  cancel-in-progress: false

jobs:
  cache-bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for triggering Pages deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for the Pages deployment of $GITHUB_SHA to finish before creating the cache-version commit."
          for attempt in $(seq 1 60); do
            runs=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100")

            status=$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name == "pages build and deployment")][0].status // "missing"')
            conclusion=$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name == "pages build and deployment")][0].conclusion // ""')

            if [ "$status" = "completed" ]; then
              echo "Triggering Pages deployment completed with conclusion: ${conclusion:-unknown}."
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for the triggering Pages deployment." >&2
              exit 1
            fi

            sleep 3
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increment global cache version and update all pages
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          version_file = Path('cache-version.txt')
          current = int(version_file.read_text(encoding='utf-8').strip())
          version = current + 1
          version_file.write_text(f'{version}\n', encoding='utf-8')

          asset_pattern = re.compile(r'(/Portfolio/assets/[A-Za-z0-9._/-]+\.(?:css|js))(?:\?v=[^"\'<>\\\s]*)?')
          page_pattern = re.compile(r'(href=["\'])(/Portfolio/(?:de/)?apps/[A-Za-z0-9._/-]+/?)(?:\?v=[^"\']*)?(["\'])')
          theme_pattern = re.compile(r'<link rel=["\']stylesheet["\'] href=["\']/Portfolio/assets/(?:dark-theme|light-theme|color-theme)\.css(?:\?v=[^"\']*)?["\']\s*/?>')
          styles_pattern = re.compile(r'(<link rel=["\']stylesheet["\'] href=["\']/Portfolio/assets/styles\.css(?:\?v=[^"\']*)?["\'][^>]*>)')
          theme_init_pattern = re.compile(r'<script data-portfolio-theme-init>.*?</script>')
          theme_init = '<script data-portfolio-theme-init>try{const t=localStorage.getItem("portfolio-theme");if(["dark","light","color"].includes(t))document.documentElement.dataset.theme=t}catch{}</script>'
          relative_js_pattern = re.compile(r'(["\'])(\./[A-Za-z0-9._/-]+\.js)(?:\?v=[^"\']*)?\1')

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = asset_pattern.sub(lambda m: f'{m.group(1)}?v={version}', text)
              updated = page_pattern.sub(lambda m: f'{m.group(1)}{m.group(2)}?v={version}{m.group(3)}', updated)

              updated = theme_pattern.sub('', updated)
              theme_links = ''.join([
                  f'<link rel="stylesheet" href="/Portfolio/assets/dark-theme.css?v={version}">',
                  f'<link rel="stylesheet" href="/Portfolio/assets/light-theme.css?v={version}">',
                  f'<link rel="stylesheet" href="/Portfolio/assets/color-theme.css?v={version}">',
              ])
              updated, count = styles_pattern.subn(lambda m: m.group(1) + theme_links, updated, count=1)
              if count == 0:
                  raise RuntimeError(f'Could not find styles.css reference in {path}')

              updated = theme_init_pattern.sub('', updated)
              if '<head>' not in updated:
                  raise RuntimeError(f'Could not find head in {path}')
              updated = updated.replace('<head>', '<head>' + theme_init, 1)

              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Keep the complete ES-module graph on one cache version. Firefox can otherwise
          # combine a newly versioned entry module with an older unversioned dependency.
          for path in Path('assets').glob('*.js'):
              text = path.read_text(encoding='utf-8')
              updated = relative_js_pattern.sub(lambda m: f'{m.group(1)}{m.group(2)}?v={version}{m.group(1)}', text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          switcher = Path('assets/theme-switcher.js')
          switcher_text = switcher.read_text(encoding='utf-8')
          switcher_text, count = re.subn(r'const e=`[^`]+`;', f'const e=`{version}`;', switcher_text, count=1)
          if count == 0:
              raise RuntimeError('Could not update theme-switcher cache version')
          switcher.write_text(switcher_text, encoding='utf-8')
          PY

      - name: Commit global cache version
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache-version.txt '*.html' 'apps/**/*.html' 'de/**/*.html' 2>/dev/null || true
          git add -u
          git commit -m "Apply global cache version"
          git pull --rebase origin main
          git push
