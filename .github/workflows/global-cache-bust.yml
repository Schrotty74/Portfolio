name: Validate global cache version

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "assets/**"
      - "cache-version.txt"
      - ".github/workflows/global-cache-bust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-global-cache-validation
  cancel-in-progress: true

jobs:
  validate-cache-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate cache references
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          version = Path("cache-version.txt").read_text(encoding="utf-8").strip()
          if not version.isdigit():
              raise SystemExit("cache-version.txt must contain one numeric version")

          expected = f"?v={version}"
          allowed_versions = {version}
          if version.isdigit() and int(version) > 0:
              allowed_versions.add(str(int(version) - 1))
          mismatches = []

          asset_pattern = re.compile(r'/Portfolio/assets/[A-Za-z0-9._/-]+\.(?:css|js)(?:\?v=([^"\'<>\\s]+))?')
          page_pattern = re.compile(r'/Portfolio/(?:de/)?apps/[A-Za-z0-9._/-]+/?\?v=([^"\'<>]+)')

          for path in Path(".").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              for match in asset_pattern.finditer(text):
                  if match.group(1) not in allowed_versions:
                      mismatches.append(f"{path}: {match.group(0)}")
              for match in page_pattern.finditer(text):
                  if match.group(1) != version:
                      mismatches.append(f"{path}: {match.group(0)}")

          if mismatches:
              print("Cache-version mismatches found:")
              print("\n".join(mismatches))
              sys.exit(1)

          print(f"All cache references use {expected}. No files were changed and no commit will be created.")
          PY
