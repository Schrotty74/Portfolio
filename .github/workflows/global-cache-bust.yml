name: Apply global cache version

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "assets/**"
      - ".github/workflows/global-cache-bust.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-global-cache-bust
  cancel-in-progress: false

jobs:
  cache-bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increment global cache version and update all pages
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          version_file = Path('cache-version.txt')
          current = int(version_file.read_text(encoding='utf-8').strip())
          version = current + 1
          version_file.write_text(f'{version}\n', encoding='utf-8')

          asset_pattern = re.compile(r'(/Portfolio/assets/[A-Za-z0-9._/-]+\.(?:css|js))(?:\?v=[^"\'<>\\\s]*)?')
          page_pattern = re.compile(r'(href=["\'])(/Portfolio/(?:de/)?apps/[A-Za-z0-9._/-]+/?)(?:\?v=[^"\']*)?(["\'])')
          theme_pattern = re.compile(r'<link rel=["\']stylesheet["\'] href=["\']/Portfolio/assets/(?:dark-theme|light-theme|color-theme)\.css(?:\?v=[^"\']*)?["\']\s*/?>')
          styles_pattern = re.compile(r'(<link rel=["\']stylesheet["\'] href=["\']/Portfolio/assets/styles\.css(?:\?v=[^"\']*)?["\'][^>]*>)')

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = asset_pattern.sub(lambda m: f'{m.group(1)}?v={version}', text)
              updated = page_pattern.sub(lambda m: f'{m.group(1)}{m.group(2)}?v={version}{m.group(3)}', updated)

              updated = theme_pattern.sub('', updated)
              theme_links = ''.join([
                  f'<link rel="stylesheet" href="/Portfolio/assets/dark-theme.css?v={version}">',
                  f'<link rel="stylesheet" href="/Portfolio/assets/light-theme.css?v={version}">',
                  f'<link rel="stylesheet" href="/Portfolio/assets/color-theme.css?v={version}">',
              ])
              updated, count = styles_pattern.subn(lambda m: m.group(1) + theme_links, updated, count=1)
              if count == 0:
                  raise RuntimeError(f'Could not find styles.css reference in {path}')

              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          switcher = Path('assets/theme-switcher.js')
          switcher_text = switcher.read_text(encoding='utf-8')

          old_component = 'function s({locale:e}){let[t,n]=(0,a.useState)(`dark`),r=e===`en`?[`Dark`,`Light`,`Colour`]:[`Dunkel`,`Hell`,`Bunt`],i=[`dark`,`light`,`color`];function s(e){n(e),document.documentElement.dataset.theme=e}'
          new_component = 'function s({locale:e}){let[t,n]=(0,a.useState)(()=>{try{return sessionStorage.getItem(`portfolio-theme`)||document.documentElement.dataset.theme||`dark`}catch{return document.documentElement.dataset.theme||`dark`}}),r=e===`en`?[`Dark`,`Light`,`Colour`]:[`Dunkel`,`Hell`,`Bunt`],i=[`dark`,`light`,`color`];function s(e){n(e),document.documentElement.dataset.theme=e;try{sessionStorage.setItem(`portfolio-theme`,e)}catch{}}'
          if old_component in switcher_text:
              switcher_text = switcher_text.replace(old_component, new_component, 1)
          elif 'sessionStorage.getItem(`portfolio-theme`)' not in switcher_text:
              raise RuntimeError('Could not update theme persistence in theme-switcher.js')

          init_marker = 'if(typeof document!==`undefined`){'
          init_code = 'if(typeof document!==`undefined`){try{let t=sessionStorage.getItem(`portfolio-theme`);t&&(document.documentElement.dataset.theme=t)}catch{}'
          if init_code not in switcher_text:
              if init_marker not in switcher_text:
                  raise RuntimeError('Could not find theme-switcher document init')
              switcher_text = switcher_text.replace(init_marker, init_code, 1)

          switcher_text, count = re.subn(r'const e=`[^`]+`;', f'const e=`{version}`;', switcher_text, count=1)
          if count == 0:
              raise RuntimeError('Could not update theme-switcher cache version')
          switcher.write_text(switcher_text, encoding='utf-8')
          PY

      - name: Commit global cache version
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache-version.txt '*.html' 'apps/**/*.html' 'de/**/*.html' 2>/dev/null || true
          git add -u
          git commit -m "Apply global cache version"
          git pull --rebase origin main
          git push
