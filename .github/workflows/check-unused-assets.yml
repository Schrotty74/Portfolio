name: Check unused static assets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Check only or remove the reported unused assets"
        required: true
        default: check
        type: choice
        options:
          - check
          - remove

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find unused assets
        env:
          OUTPUT_FILE: ${{ runner.temp }}/unused-assets.txt
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(directory) {
            if (!fs.existsSync(directory)) return [];
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap(entry => {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) return entry.name === '.git' ? [] : walk(file);
              return [file];
            });
          }

          const assets = walk('assets')
            .map(file => path.relative('assets', file).split(path.sep).join('/'));
          const pages = walk('.')
            .filter(file => file.endsWith('.html') || file === '.vite/manifest.json');
          const contents = new Map(
            [...pages, ...assets.map(asset => path.join('assets', asset))]
              .map(file => [file, fs.readFileSync(file, 'utf8')])
          );
          const references = text => assets.filter(asset => text.includes(asset));
          const reachable = new Set(pages.flatMap(page => references(contents.get(page))));

          if (assets.length && reachable.size === 0) {
            throw new Error('No asset references found; refusing cleanup.');
          }

          const pending = [...reachable];
          while (pending.length) {
            const asset = pending.shift();
            for (const dependency of references(contents.get(path.join('assets', asset)))) {
              if (!reachable.has(dependency)) {
                reachable.add(dependency);
                pending.push(dependency);
              }
            }
          }

          const unused = assets.filter(asset => !reachable.has(asset));
          fs.writeFileSync(process.env.OUTPUT_FILE, unused.join('\n') + (unused.length ? '\n' : ''));
          const size = unused.reduce((total, asset) => total + fs.statSync(path.join('assets', asset)).size, 0);
          console.log(`Found ${unused.length} unused assets (${size} bytes).`);
          for (const asset of unused) console.log(`- ${asset}`);
          NODE
      - name: Remove confirmed unused assets
        if: inputs.mode == 'remove'
        env:
          INPUT_FILE: ${{ runner.temp }}/unused-assets.txt
        run: |
          if [ ! -s "$INPUT_FILE" ]; then exit 0; fi
          while IFS= read -r asset; do
            git rm -- "assets/$asset"
          done < "$INPUT_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove unused static assets [skip ci]"
          git push
